<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Interview Agent - Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            display: flex;
            height: 600px;
        }

        .controls {
            flex: 1;
            padding: 30px;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .transcript {
            flex: 1.5;
            padding: 30px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff3838;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .transcript-header {
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transcript-entry {
            margin-bottom: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .transcript-entry.participant {
            border-left-color: #764ba2;
        }

        .transcript-entry .speaker {
            font-weight: 600;
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .transcript-entry.participant .speaker {
            color: #764ba2;
        }

        .transcript-entry .text {
            color: #333;
            line-height: 1.5;
        }

        .transcript-entry .time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        .video-container {
            margin-top: 20px;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .progress-bar {
            margin-top: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            border-radius: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Voice Interview Agent</h1>
            <p>Test Client for IPG Voice Interview System</p>
        </div>

        <div class="content">
            <div class="controls">
                <div class="form-group">
                    <label for="campaignId">Campaign ID</label>
                    <input type="text" id="campaignId" placeholder="Enter campaign ID from Supabase">
                </div>

                <div class="form-group">
                    <label for="participantName">Participant Name (Optional)</label>
                    <input type="text" id="participantName" placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="participantEmail">Participant Email (Optional)</label>
                    <input type="email" id="participantEmail" placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label for="enableRecording">
                        <input type="checkbox" id="enableRecording" style="width: auto; margin-right: 8px;">
                        Enable Recording
                    </label>
                </div>

                <div class="button-group">
                    <button id="connectBtn" class="btn-primary">Start Interview</button>
                    <button id="disconnectBtn" class="btn-danger" disabled>End Interview</button>
                </div>

                <div id="status" class="status disconnected">
                    Status: Not Connected
                </div>

                <div id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="progress-info">
                        <span id="currentStep">Not started</span>
                        <span id="progressPercent">0%</span>
                    </div>
                </div>

                <div class="video-container">
                    <video id="localVideo" autoplay muted></video>
                </div>
            </div>

            <div class="transcript">
                <div class="transcript-header">
                    <span>Live Transcript</span>
                    <button id="clearTranscript" class="btn-secondary" style="padding: 6px 12px; font-size: 12px;">Clear</button>
                </div>
                <div id="transcriptContainer">
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                        <p>Transcript will appear here once the interview starts</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/client.js"></script>
</body>
</html>
